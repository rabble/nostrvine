appId: co.openvine.app
tags:
  - recorder
---
#TC for the lip-sync audio gate,
# given the recorder is open on a lip-sync viewfinder with no sound picked,
# validate the shutter refuses to record and says why.
#
# This is the one behaviour lip-sync adds over capture mode. Without a sound
# the record button is swapped for a blocked one whose tap only raises a
# snackbar — a recording started here would be synced to nothing.
#
# Needs real camera hardware only in the sense that the rest of the flow does:
# the blocked button is rendered from the audio selection alone, so this test
# would pass on a camera-less device while every capture-mode shutter test
# hangs.
#Steps:
# 1. Tap the shutter with no sound: the "add audio" snackbar appears
# 2. Validate no recording started

# 1. Tap the blocked shutter.
#
# The snackbar is asserted by copy because it has none of its own identifier:
# it is a DivineSnackbarContainer, and adding one is a divine_ui change that
# drags that package's 100% coverage gate along with it — the same call
# openRecorder.yaml makes for the education sheet. So this line needs an
# English app UI, like the rest of the suite.
#
# It is worth the copy dependency: without it the step only proves that
# nothing happened, which is also what a dead button looks like.
- tapOn:
    id: camera_record_button
- extendedWaitUntil:
    visible: "Add audio before recording"
    timeout: 10000

# 2. And nothing recorded. While recording, the top bar swaps its close/next
# row out for the recording-progress bar entirely, so the close button still
# being there is what proves the tap did not start one.
- assertVisible:
    id: camera_close_button
- assertNotVisible:
    id: camera_next_button

# Let the snackbar go before handing back, so it is not still floating over
# the viewfinder for whatever runs next. `waitForAnimationToEnd` runs its
# timeout out rather than returning early, because the live camera preview
# never stops changing.
- waitForAnimationToEnd:
    timeout: 4500
- runFlow: ../asserts/assertLipSyncMode.yaml
