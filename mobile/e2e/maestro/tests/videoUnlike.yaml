appId: co.openvine.app.staging
tags:
  - Social
---
#TC to unlike a video.
#
# Precondition: the signed-in account has exactly one liked video. This is
# guaranteed by construction rather than by luck -- likeFlow runs
# loginFreshInstall, which creates a brand-new account with zero likes, then
# videoLike adds exactly one. Nothing here depends on what the wider STAGING
# relay happens to hold.
#
#Steps:
# 1. Open the profile and navigate to the liked_tab: Tab is displayed
# 2. Tap the only liked video and unlike it: the feed drains
# 3. Close the video and re-open the liked tab: the video is gone

# 1. Open the profile and navigate to the liked_tab: Tab is displayed
- tapOn:
    id: profile_tab
- runFlow: ../asserts/assertProfile.yaml
- tapOn:
    id: "liked_tab"

# 2. Tap the only liked video and unlike it
- tapOn:
    id: "liked_video_thumbnail_0"
- runFlow: ../asserts/assertVideoPlayback.yaml
- tapOn:
    id: like_button

# Unliking the only liked video empties the feed this route is playing, so
# the screen settles on its drained state rather than back on the player.
# This asserts an app-owned outcome, which is why it does not depend on
# which video the grid happened to hold.
- runFlow: "../asserts/assertVideoFeedDrained.yaml"

# 3. Close the video and Tap on profile, liked tab: Validate tab is loaded and video is not listed
# The liked-grid tap opens PooledFullscreenVideoFeedScreen, which has no
# "Close video player" control -- that label belongs to VideoDetailScreen,
# a different route. This screen dismisses through the app bar's back
# button, addressed by identifier rather than its localized label.
- tapOn:
    id: "back_button"
- tapOn:
    id: "liked_tab"
- assertNotVisible:
    id: "liked_video_thumbnail_0"
