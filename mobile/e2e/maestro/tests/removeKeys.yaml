appId: co.openvine.app.staging
tags:
  - auth
  - settings
---
#TC to remove the local account keys from the device.
#
# This is the teardown of every smoke flow, and it is what makes the suite
# repeatable: the Nostr key lives in the iOS keychain and survives both
# `launchApp: clearState` and a full app uninstall, so without this step
# every subsequent run starts already signed in.
#
#Steps:
# 1. Open Settings, then Nostr Settings
# 2. Tap Remove keys, cancel once to prove the escape hatch works
# 3. Tap it again and confirm: the device returns to the welcome screen

# 1. Settings -> Nostr Settings
- runFlow: '../utils/openSettings.yaml'
- tapOn:
    id: "nostr_settings_tile"

# 2. Remove keys, then cancel.
#
# Targeted by id: the row's title and subtitle both changed ("Remove Keys
# from Device" is now "Remove this account from this device") and it moved
# off the Settings root onto this screen.
- extendedWaitUntil:
    visible:
      id: "remove_keys_tile"
    timeout: 30000
- tapOn:
    id: "remove_keys_tile"
- tapOn: Cancel

# 3. Confirm.
#
# The sheet's buttons are still selected by copy: VineBottomSheetPrompt
# takes no semantics identifier yet, and adding one is a wider change than
# this flow needs. deleteAccountRemoveKeysConfirm is the string.
- tapOn:
    id: "remove_keys_tile"
- tapOn: Remove from device

- runFlow: '../asserts/assertLogin.yaml'
