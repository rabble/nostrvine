appId: co.openvine.app.staging
---
- runFlow: ../tests/loginFreshInstall.yaml
- runFlow: ../tests/commentVideo.yaml

# Cleanup runs before the back navigation, not after: deleteComment reopens
# the comments sheet from the player and needs the video still on screen.
- runFlow: ../tests/deleteComment.yaml

# Leave the player. DiVineAppBar's back control is addressed by identifier;
# its label is localized, so text matching would break outside English.
- tapOn:
    id: back_button
- assertVisible:
    id: video_thumbnail_0

- runFlow: ../tests/removeKeys.yaml
#Tear down
- killApp
