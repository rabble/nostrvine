appId: co.openvine.app
---
#Lip-sync journey: create an account, open the recorder on lip-sync, drive its
#control rail, prove the shutter is gated on picking a sound, and sign the
#device back out.
#
# Account creation is a precondition, not part of what is under test. The
# recorder route itself is public — appRouterRedirect exempts it — but the only
# way into it is the feed's camera button, and the feed is not public: an
# unauthenticated launch redirects to Welcome.
#
# Requires real camera hardware for the lens switch in lipSyncModeControls.
#
# **Recording a lip-sync clip is out of scope**, and that is the whole reason
# this flow is shorter than the other two. The shutter is gated on a selected
# sound, and picking one means driving the audio sheet against whatever the
# relay is serving — the same live-content dependency the README already names
# as the suite's main source of flakiness. What is covered instead is the gate
# itself, which is the behaviour lip-sync actually adds.

- runFlow: ../tests/loginFreshInstall.yaml

# Relaunch with camera and microphone pre-granted. Otherwise the first camera
# tap raises the native OS permission dialog, whose buttons are OS-localized
# copy that no selector should depend on.
#
# Deliberately no clearState: on Android `pm clear` wipes the encrypted
# preferences the Nostr key lives in, which would sign the account straight
# back out. (The iOS keychain survives it — the platforms disagree here, so
# the flow takes the option that works on both.)
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: camera_button
    timeout: 60000

- runFlow: ../tests/lipSyncModeOpen.yaml

# Selecting a mode persists it, so this second open finds Lip Sync already
# armed rather than Capture. openLipSyncMode walks the wheel either way, and
# tapping an armed mode is a no-op.
- runFlow: ../utils/openLipSyncMode.yaml
- runFlow: ../tests/lipSyncModeControls.yaml
- runFlow: ../tests/lipSyncModeAudioGate.yaml

# Leave the recorder before teardown: removeKeys drives Settings from the
# profile tab, which the full-screen recorder covers.
- tapOn:
    id: camera_close_button
- runFlow: ../tests/removeKeys.yaml
