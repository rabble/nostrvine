appId: co.openvine.app
name: Divine Smoke regression test
---
# Only the flows that pass end to end today. The rest are held back so a
# dispatched run proves the harness works instead of re-reporting breakage
# we already track:
#
#   commentFlow     env-vs-output bug plus a disabled cleanup step (#6952)
#   searchUserFlow  needs a rewrite for the current search layout (#6952)
#
# Put each one back in the PR that fixes it, and restore the credentials it
# needs to the runners at the same time.
#
# likeFlow is back in as of #6949: its `videoUnlike` step was not failing on
# test data at all, it was failing on two app bugs in the fullscreen feed
# that both surfaced as a permanent loading placeholder. Every account it
# touches is created by the run itself, so the like it publishes and the
# "exactly one liked video" precondition do not depend on shared state.

# Account management tests
- runFlow: ../tests/loginFreshInstall.yaml
- runFlow: ../tests/removeKeys.yaml
- runFlow: ../flows/loginEmailPwd.yaml

# Social tests
- runFlow: ../flows/likeFlow.yaml
