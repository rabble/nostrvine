appId: co.openvine.app.staging
name: Divine Smoke regression test
---
# Every social flow is back in, so a dispatched run exercises the whole
# suite rather than re-reporting breakage we already track.
#
#   likeFlow        restored by #6949: `videoUnlike` was never failing on
#                   test data, it was failing on two fullscreen-feed bugs
#                   that both surfaced as a permanent loading placeholder
#   commentFlow     restored by #6952: env-vs-output bug plus a disabled
#                   cleanup step
#   searchUserFlow  restored by #6952: rewritten for the current search
#                   layout
#
# `loginEmailPwd` and `searchUserFlow` need credentials present on the runners.
# `likeFlow` and `commentFlow` are credential-free but stay off the PR gate:
# after the reduced-motion fix they still hit a blocked main thread on
# Codemagic (4m11s, "process main thread busy for 30.0s"). #7204 stays open.

# Account management tests
- runFlow: ../tests/loginFreshInstall.yaml
- runFlow: ../tests/removeKeys.yaml
- runFlow: ../flows/loginEmailPwd.yaml

# Social tests
- runFlow: ../flows/likeFlow.yaml
- runFlow: ../flows/commentFlow.yaml
- runFlow: ../flows/searchUserFlow.yaml
