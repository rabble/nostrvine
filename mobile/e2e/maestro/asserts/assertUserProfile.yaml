appId: co.openvine.app
---
- assertVisible: Refresh
- assertVisible: Videos
- assertVisible:
    text: "[0-9]+\nFollowers"
- assertVisible:
    text: "[0-9]+\nFollowing"
# The tabs, by identifier, as assertProfile.yaml already does. These were
# text matchers on "Tab N of 4\n<anchor>", which relied on the anchor being
# the accessible label -- it is now the localized tab name, so the anchor
# only survives on the identifier. The count was stale either way: another
# user's profile shows 5 tabs, not 4.
- assertVisible:
    id: "videos_tab"
- assertVisible:
    id: "liked_tab"
- assertVisible:
    id: "reposted_tab"
- assertVisible:
    id: "collabs_tab"
