appId: co.openvine.app
---
# Asserts somebody else's profile. See assertProfile.yaml for your own.
#
# Rewritten rather than patched. "Refresh" has no call site, the header no
# longer renders a "Videos" label, and the tab set is 5 here (6 on your own
# profile) -- so the old "Tab N of 4" selectors described neither.

- extendedWaitUntil:
    visible:
      id: "profile_back_button"
    timeout: 30000

- assertVisible:
    id: "profile_stats_row"

# The long-standing tabs, by identifier. #7009 gave the tabs real localized
# accessible names, so the snake_case anchor now survives only on the
# identifier -- never match these as text. Collabs and Comments are omitted
# on purpose: asserting every tab pins a feature-flag configuration.
- assertVisible:
    id: "videos_tab"
- assertVisible:
    id: "liked_tab"
- assertVisible:
    id: "reposted_tab"

- assertVisible:
    text: "^.*\\sFollowers$"
- assertVisible:
    text: "^.*\\sFollowing$"
