appId: co.openvine.app
---
# The sheet still renders a pluralized count ("0 Comments" / "1 Comment"),
# so the count regex is kept -- it is the only assertion here that proves
# the list, not just the chrome, is up.
#
# "Add comment..." is deliberately not asserted: the same placeholder is
# rendered by the inline composer on the video screen underneath, so it
# passed whether or not the sheet had opened.
- assertVisible:
    id: comments_sheet_title
- assertVisible:
    text: "\\d+\\sComments?"
- assertVisible:
    id: comment_text_field
