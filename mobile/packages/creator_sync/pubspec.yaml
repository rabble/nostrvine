name: creator_sync
description: >
  Cross-device sync for creator-owned content (sound library, clips,
  drafts) over encrypted Nostr app-data events.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  clock: ^1.1.1
  crypto: ^3.0.7
  cryptography: ^2.7.0
  meta: ^1.16.0
  models:
    path: ../models
  nostr_client:
    path: ../nostr_client
  nostr_sdk:
    path: ../nostr_sdk
  unified_logger:
    path: ../unified_logger

dev_dependencies:
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.2.0
