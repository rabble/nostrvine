name: pooled_video_player
description: Efficient video playback with object pooling for short-form video feeds.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

dependencies:
  audio_session: ^0.2.2
  device_info_plus: ^10.1.2
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  # Temporary override to fix mp_image_crop crash on iOS Simulator
# See: https://github.com/media-kit/media-kit/issues/627
# Remove once fix is merged upstream
  media_kit_video:
    git:
      url: https://github.com/magicyoda/media-kit.git
      path: media_kit_video
      ref: 7d1b8f0bd72cf19fd500d3cb8a85be3ed14864da


dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0