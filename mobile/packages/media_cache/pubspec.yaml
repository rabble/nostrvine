name: media_cache
description: A reusable media caching package built on flutter_cache_manager with corrupt cache recovery and optional sync manifest lookups.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ^3.41.1

dependencies:
  cronet_http: ^1.8.0
  # Pinned to 1.x because cupertino_http 2.x switched to the experimental
  # `native-assets` Dart feature, which does not embed
  # `cupertino_http.framework` into `Runner.app/Frameworks` reliably and
  # caused `_NativeCupertinoHttp_protocolTrampoline_…` lookup failures at
  # runtime (silent fallback to dart:io). 1.5.1 uses classic CocoaPods
  # integration, keeps HTTP/2 + HTTP/3 via NSURLSession, and embeds
  # correctly. Re-evaluate once cupertino_http 2.x's native-assets path
  # works without manual Xcode steps.
  cupertino_http: '>=1.5.1 <2.0.0'
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  http: ^1.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.3.3+1

dev_dependencies:
  file: ^7.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.6
  very_good_analysis: ^10.0.0
