name: divine_ui
description: A package for Divine UI components.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ^3.41.1

dependencies:
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.3.2
  intl: ">=0.19.0 <1.0.0"
  skeletonizer: ^2.1.2

dev_dependencies:
  alchemist: ^0.12.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  # Bundled so google_fonts resolves the theme fonts from assets (runtime HTTP
  # fetching is disabled in tests). SIL OFL 1.1 texts ship alongside in
  # assets/licenses/. Required for text-bearing golden tests to render.
  assets:
    - assets/fonts/
