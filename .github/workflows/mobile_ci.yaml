name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect App CI Scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      # No checkout: the changed-file list comes from the REST API. A
      # `fetch-depth: 0` clone cost ~23s of this workflow's critical path
      # (every other job `needs: changes`) to produce a list the API already
      # has.
      - name: Detect whether app CI is required
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event; running full app CI."
            exit 0
          fi

          # The files endpoint caps at 3000 entries. A PR that large is not a
          # scoped change, so fall open to the full matrix rather than
          # under-running CI on a truncated list.
          changed_total=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')
          if [ "$changed_total" -gt 3000 ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "PR touches $changed_total files (> 3000 API cap); running full app CI."
            exit 0
          fi

          gh api --method GET --paginate -F per_page=100 "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > /tmp/mobile-ci-changed-files.txt
          echo "Changed files:"
          cat /tmp/mobile-ci-changed-files.txt

          app=false
          native=false
          while IFS= read -r path; do
            case "$path" in
              .github/ci-timing-budgets.json)
                app=true
                ;;
              .github/workflows/*)
                app=true
                native=true
                ;;
              *.md|docs/*|brand-guidelines/*|mobile/docs/*)
                # Docs-only changes do not need the full app test matrix.
                ;;
              mobile/lib/*|mobile/test/*|mobile/integration_test/*|mobile/scripts/*)
                app=true
                ;;
              mobile/android/*|mobile/ios/*|mobile/macos/*|mobile/web/*|mobile/assets/*|mobile/fonts/*|mobile/overrides/*|mobile/l10n/*)
                app=true
                ;;
              mobile/pubspec.yaml|mobile/pubspec.lock|mobile/dart_test.yaml|mobile/analysis_options.yaml|mobile/build.yaml|mobile/l10n.yaml)
                app=true
                ;;
              mobile/*)
                app=true
                ;;
            esac
            # The transport-security guard reads one Android XML plus three
            # Info.plists and nothing else, so its verdict cannot change
            # unless a native config or the guard itself changed. Matched at
            # directory level (a superset of the guard's inputs) so the gate
            # can't silently drift when the guard gains a fourth plist.
            case "$path" in
              mobile/android/*|mobile/ios/*|mobile/macos/*|mobile/scripts/check_native_transport_security.sh)
                native=true
                ;;
            esac
          done < /tmp/mobile-ci-changed-files.txt

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          if [ "$app" = "true" ]; then
            echo "App CI required."
          else
            echo "Package-only/docs-only change; app CI jobs may be skipped."
          fi
          echo "Native transport-security inputs changed: $native"

  generated-files:
    name: Generated Files
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v4
      - name: 🔀 Fetch origin/main for ratchet baselines
        # The ratchet scripts below compare against origin/main. Fetch it once
        # here so each script is order-independent; a fetch failure fails the
        # job (the guards fail closed when the base baseline can't load).
        run: git fetch --quiet --depth=1 origin main
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: 🔒 Verify native transport security
        # Skipped when no native config changed. The guard's only inputs are
        # mobile/android/**, mobile/ios/**, mobile/macos/** and its own
        # script; if none of those moved, its verdict is identical to the one
        # main already recorded. Gating it also skips the apt install of
        # libxml2-utils (~42s, of which `apt-get update` alone is ~28s), which
        # is the single most expensive step in this job after codegen.
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
          bash scripts/check_native_transport_security.sh
      - name: 🌐 Verify backend-host defaults stay on *.divine.video
        run: bash scripts/check_backend_host_defaults.sh
      - name: 🪵 Verify no raw logging in production code
        run: bash scripts/check_raw_logging.sh
      - name: 🌐 Verify no untagged test mutates HttpOverrides.global
        run: bash scripts/check_http_overrides_isolation.sh
      - name: 🧬 Verify no untagged test leaks a process-global singleton
        run: bash scripts/check_process_global_mutations.sh
      - name: 🧯 Verify integration_test error-handler restores are exception-safe
        run: bash scripts/check_integration_test_error_restore_safety.sh
      - name: 🔌 Verify no new raw shared-channel installs (heal-and-blame ratchet)
        run: |
          # LIST ratchet vs origin/main (fails closed if the base baseline can't
          # load). The runtime heal-and-blame tearDown (flutter_test_config.dart)
          # is the primary guard; this freezes raw setMockMethodCallHandler
          # installs of the five shared channels so new ones must go through
          # overrideSharedChannel(...). #5738.
          bash scripts/check_shared_channel_overrides.sh
      - name: 📦 Verify no new package-test channel leaks (per-package merged-isolate ratchet)
        run: |
          # Packages analogue of the shared-channel ratchet above. Each package runs
          # its own very_good --optimization merged isolate and — unlike mobile/test —
          # has no flutter_test_config.dart heal-and-blame harness, so an un-torn-down
          # channel mock leaks across that package's suite. Freezes package *_test.dart
          # entries that install a channel handler without nulling any back down; new
          # ones must add a tearDown (or a skip tag). #5838.
          bash scripts/check_package_channel_isolation.sh
      - name: 🚧 Verify Riverpod boundary (@riverpod / StateProvider locations)
        run: bash scripts/check_riverpod_boundary.sh
      - name: 🚧 Verify ChangeNotifier boundary (sanctioned-allowlist ratchet)
        run: bash scripts/check_changenotifier_boundary.sh
      - name: 🚧 Verify UI does not import services directly (layering ratchet)
        # Compares the baseline against origin/main (fetched once at job start);
        # the guard fails closed when the base baseline cannot be loaded.
        run: bash scripts/check_ui_service_boundary.sh
      - name: 🧪 Verify skipped-test count does not increase (skip-ceiling ratchet)
        # Skip-debt epic: #4337 (WS-1). Guard fails closed if the baseline can't load.
        run: bash scripts/check_skip_ceiling.sh
      - name: ⏳ Verify Future.delayed-in-tests count does not increase (ratchet)
        run: bash scripts/check_future_delayed_ceiling.sh
      - name: ⏳ Verify Future.delayed-in-production count does not increase (ratchet)
        run: |
          # Production (mobile/lib) counterpart of the test-scoped ratchet above.
          # Fails closed if the base baseline cannot be loaded. Epic: #4339 (PR-4).
          bash scripts/check_future_delayed_production_ceiling.sh
      - name: 🧱 Verify untested-services count does not increase (floor ratchet)
        run: bash scripts/check_untested_services_floor.sh
      - name: 🧱 Verify test/unit does not re-accrete (test-structure ratchet)
        run: |
          # Freezes the legacy non-mirroring test/unit bucket per-file so it can
          # only shrink. New tests must mirror lib/ (test/services/foo_test.dart),
          # never test/unit/. Fails closed if the base baseline cannot load.
          # Test-org epic: #4337 (WS-7).
          bash scripts/check_test_unit_structure.sh
      - name: 🧱 Verify every package ships analysis options + a CI workflow (package CI floor)
        run: |
          # Issues #3574 / #3575: optionless packages silently inherit the
          # app's relaxed analyzer config; workflow-less packages get no CI.
          bash scripts/check_package_ci_floor.sh
      - name: 🧱 Verify per-package coverage floors do not decrease (coverage floor ratchet)
        run: |
          # Follow-up to #3575: each package workflow's min_coverage is locked in
          # a baseline and may only RISE. VGV already fails when measured coverage
          # drops below the floor; this stops the floor itself from being lowered.
          # Fails closed if the base baseline cannot be loaded.
          bash scripts/check_package_coverage_floor.sh
      - name: 🧯 Verify empty-catch count does not increase (reliability ratchet)
        run: |
          # Reliability ceilings (epic #4336). Each fails closed if the base
          # baseline cannot be loaded.
          bash scripts/check_empty_catch_ceiling.sh
      - name: 🧯 Verify service error-sentinel count does not increase (reliability ratchet)
        run: bash scripts/check_service_sentinel_ceiling.sh
      - name: 🧯 Verify ARB {error}-interpolation count does not increase (reliability ratchet)
        run: bash scripts/check_arb_error_ceiling.sh
      - name: 📏 Report oversized files (advisory — does not block CI)
        run: |
          # The 800-line file-size ceiling is advisory (team decision): it
          # reports new oversized files and files that grew past their recorded
          # ceiling as a warning, but the script always exits 0 and never fails
          # the job. Surface the findings as a GitHub warning annotation so they
          # bubble up to the PR. Oversized-file epic: #4339 (PR-1).
          output="$(bash scripts/check_file_size_ceiling.sh)"
          echo "$output"
          if printf '%s\n' "$output" | grep -q '^WARN \[file_size_ceiling\]'; then
            echo "::warning title=File-size ceiling (advisory)::One or more Dart files are newly over 800 lines or grew past their recorded ceiling. This is advisory and does not block CI — see the step log for the list."
          fi
      - name: 🎨 Verify raw Icons.* count does not increase (DivineIcon ratchet)
        run: |
          # Freezes the deferred raw Material Icons.* residue (#4803) per-file so
          # the migration can only shrink. origin/main provides the base ref for
          # the anti-bypass check; fails closed if it cannot load the baseline.
          bash scripts/check_raw_icons_ceiling.sh
      - name: 🎨 Verify raw TextStyle( count does not increase (VineTheme ratchet)
        run: |
          # Design-system drift ceilings (#6145, epic #4339). Each freezes a
          # per-file count of raw UI patterns under mobile/lib so new drift is
          # intentional; existing debt is baselined, not fixed. Fails closed if
          # the base baseline cannot be loaded. New UI must use the divine_ui /
          # VineTheme sanctioned replacements — see the script headers.
          bash scripts/check_raw_textstyle_ceiling.sh
      - name: 🎨 Verify raw color count does not increase (VineTheme ratchet)
        run: bash scripts/check_raw_colors_ceiling.sh
      - name: 🎨 Verify direct Material-button count does not increase (DivineButton ratchet)
        run: bash scripts/check_material_button_ceiling.sh
      - name: 🎨 Verify raw dialog/bottom-sheet count does not increase (VineBottomSheet ratchet)
        run: bash scripts/check_raw_dialog_ceiling.sh
      - name: 🎨 Verify no VineTheme.*Font( call omits its color (light-mode ratchet)
        run: bash scripts/check_implicit_font_color_ceiling.sh
      - name: 🔨 Verify generated files are up-to-date
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚠️ Generated files are out of date. Please run 'dart run build_runner build' and commit the changes."
            git diff --name-only
            exit 1
          fi
      - name: 🌐 Verify l10n generated files
        run: |
          flutter gen-l10n
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚠️ L10n generated files are out of date. Please run 'flutter gen-l10n' and commit the changes."
            git diff --name-only
            exit 1
          fi
  format:
    name: Format
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        # Required: `dart format` reads page width from analysis_options.yaml,
        # which `include`s package:very_good_analysis. Without a resolved
        # package config that include fails and the formatter silently falls
        # back to its defaults, reformatting 529 files.
        run: flutter pub get
      - name: ✨ Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
  analyze:
    name: Analyze
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: 🕵️ Analyze code
        run: flutter analyze lib test integration_test
  tests:
    name: Tests (shard ${{ strategy.job-index }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      # Every shard must report. Stopping the others on one failure hides
      # additional failures and forces a second full round-trip to find them.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: 🛠️ Install Very Good CLI
        # Pinned so the optimizer's bundle mechanics don't float under CI. 1.3.0
        # is the current latest; 1.1.1≡1.2.0≡1.3.0 for all test/optimizer
        # mechanics (package workflows pin 1.1.1 via very_good_workflows). #5738.
        run: dart pub global activate very_good_cli 1.3.0
      - name: 🔪 Reduce test/ to this shard
        # --optimization bundles every untagged test file into ONE suite, so
        # --concurrency=4 has nothing left to schedule once the 18 tagged files
        # finish and the bulk of the run is single-core. Splitting the file set
        # across 4 runners gives each one a smaller bundle and puts the four
        # vCPUs of four machines on the problem instead of one core of one.
        # The script is a pure partition of test/**/*_test.dart — see
        # test/tools/select_test_shard_test.dart.
        run: bash scripts/ci/select_test_shard.sh --total ${{ strategy.job-total }} --index ${{ strategy.job-index }}
      - name: 🚀 Run Flutter tests
        # concurrency=4 matches the ubuntu runner's 4 vCPUs. The merged runner
        # alongside the tagged files runs race-free at 4 (verified locally at 4
        # and 6) with every skip_very_good_optimization tag still present — no
        # AppDatabase "database is locked", no path_provider collisions (#3137).
        # concurrency=1 once pushed the job past 1 hour because each tagged file
        # pays a full Dart VM startup; a higher ceiling overlaps those startups.
        run: very_good test --optimization --concurrency=4 --exclude-tags integration --test-randomize-ordering-seed random
  vgv-tag-gate:
    name: VGV Tag Gate
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v4
      - name: 🏷️ Verify skip_very_good_optimization tag count does not increase
        # Guards #3137. The tag set drifts silently: a feature PR can add a
        # new `@Tags(['skip_very_good_optimization'])` opt-out without anyone
        # noticing, growing the CI debt. This step fails the PR when the
        # count exceeds `test/vgv_tag_baseline.txt`. Decreases are always
        # allowed; untag PRs may (but don't have to) lower the baseline to
        # ratchet progress — lowering makes the gate tighter for future PRs.
        run: |
          baseline=$(cat test/vgv_tag_baseline.txt | tr -d '[:space:]')
          current=$(grep -rln "skip_very_good_optimization" test | wc -l | tr -d '[:space:]')
          if [ "$current" -gt "$baseline" ]; then
            echo "❌ VGV tag count increased: baseline=$baseline, current=$current"
            echo ""
            echo "A new '@Tags([\"skip_very_good_optimization\"])' was added."
            echo "Either:"
            echo "  (a) fix the underlying test-isolation issue so the file"
            echo "      passes under the VGV optimizer without the tag, or"
            echo "  (b) if the tag is genuinely permanent (e.g. the file uses"
            echo "      IntegrationTestWidgetsFlutterBinding), add an inline"
            echo "      '// Permanent: <reason>' comment next to the tag AND"
            echo "      update mobile/test/vgv_tag_baseline.txt to $current."
            exit 1
          fi
          echo "✅ VGV tag count OK: current=$current, baseline=$baseline"
      - name: 🏷️ Verify no integration-only file-level @Tags
        # Guards the #5340 regression class (#5738). The generated
        # .test_optimizer.dart drops file-level @Tags, so
        # `--exclude-tags integration` CANNOT exclude a bundled file — an
        # 'integration'-only file tag is a dead letter that silently runs
        # inside the merged CI suite. A file-level integration tag is only
        # meaningful together with skip_very_good_optimization (run as a
        # separate suite, which -x integration then excludes).
        # Matching is whitespace-normalized so a dart-format-wrapped
        # multi-line @Tags([...]) cannot slip past as a false negative.
        run: |
          violations=""
          while IFS= read -r f; do
            flat=$(tr -d '[:space:]' < "$f")
            if grep -qE "@Tags\(\[[^]]*['\"]integration['\"]" <<<"$flat" \
              && ! grep -qE "@Tags\(\[[^]]*['\"]skip_very_good_optimization['\"]" <<<"$flat"; then
              violations="$violations  $f"$'\n'
            fi
          done < <(grep -rl "@Tags(" test --include='*.dart' || true)
          if [ -n "$violations" ]; then
            echo "❌ File-level @Tags(['integration']) without skip_very_good_optimization:"
            printf '%s' "$violations"
            echo ""
            echo "File-level @Tags are dropped inside the merged VGV bundle, so these"
            echo "files RUN in CI despite --exclude-tags integration. Either:"
            echo "  (a) remove the dead-letter 'integration' tag, or"
            echo "  (b) add 'skip_very_good_optimization' to the same @Tags annotation"
            echo "      (with a '// Permanent: <reason>' comment) and bump"
            echo "      mobile/test/vgv_tag_baseline.txt."
            exit 1
          fi
          echo "✅ No integration-only file-level @Tags"
  mobile-ci:
    name: Mobile CI
    if: ${{ always() }}
    needs:
      - changes
      - generated-files
      - format
      - analyze
      - tests
      - vgv-tag-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Verify upstream jobs
        env:
          GENERATED_FILES_RESULT: ${{ needs.generated-files.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          VGV_TAG_GATE_RESULT: ${{ needs.vgv-tag-gate.result }}
          APP_CI_REQUIRED: ${{ needs.changes.outputs.app }}
        run: |
          echo "app-ci-required: ${APP_CI_REQUIRED}"
          echo "generated-files: ${GENERATED_FILES_RESULT}"
          echo "format: ${FORMAT_RESULT}"
          echo "analyze: ${ANALYZE_RESULT}"
          echo "tests: ${TESTS_RESULT}"
          echo "vgv-tag-gate: ${VGV_TAG_GATE_RESULT}"

          results=(
            "${GENERATED_FILES_RESULT}"
            "${FORMAT_RESULT}"
            "${ANALYZE_RESULT}"
            "${TESTS_RESULT}"
            "${VGV_TAG_GATE_RESULT}"
          )

          if [ "${APP_CI_REQUIRED}" = "false" ]; then
            for result in "${results[@]}"; do
              if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
                echo "One or more Mobile CI jobs failed or were cancelled."
                exit 1
              fi
            done
            echo "App CI intentionally skipped for this PR."
            exit 0
          fi

          for result in "${results[@]}"; do
            if [ "${result}" != "success" ]; then
              echo "One or more Mobile CI jobs failed."
              exit 1
            fi
          done

          if [ "${APP_CI_REQUIRED}" != "true" ]; then
            echo "Could not determine Mobile CI scope."
            exit 1
          fi
      - name: Checkout timing budget inputs
        uses: actions/checkout@v4
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
        with:
          sparse-checkout: |
            .github/ci-timing-budgets.json
            mobile/scripts/ci
          sparse-checkout-cone-mode: false
      - name: ⏱️ Check CI timing budget
        # This job only starts once every other job has finished, so the run's
        # job durations are final here. Budgets live in
        # .github/ci-timing-budgets.json; over-warn annotates the PR, over-fail
        # fails this gate. Guards the wins recorded in PERF_BASELINE.md from
        # eroding silently.
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 mobile/scripts/ci/check_ci_timing_budget.py \
            --budgets .github/ci-timing-budgets.json \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}"
