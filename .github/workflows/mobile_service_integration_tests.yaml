name: Mobile Integration Tests (Services)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile/integration_test/e2e/**"
      - "mobile/integration_test/helpers/**"
      - "mobile/lib/services/relay_discovery_service.dart"
      - "mobile/packages/nostr_sdk/**"
      - "mobile/packages/nostr_client/**"
      - "mobile/packages/dm_repository/**"
      - "mobile/packages/db_client/**"
      - ".github/workflows/mobile_service_integration_tests.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-tests:
    name: Integration Tests (services)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true
      # `flutter test integration_test/...` runs in integration-test mode, which
      # requires a real device and refuses web ones. This runner offers Linux
      # (desktop) and Chrome (web); with both present device selection is
      # ambiguous and the run dies with "No devices are connected", so the
      # target has to be named explicitly below.
      #
      # The apt list is the Flutter Linux toolchain plus every pkg-config
      # module the app's Linux plugins declare: webkit2gtk-4.1
      # (desktop_webview_window), libsecret-1 (flutter_secure_storage_linux),
      # gstreamer-1.0 + gstreamer-pbutils-1.0 (pro_video_editor).
      - name: 🧰 Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libwebkit2gtk-4.1-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsqlite3-dev xvfb
          flutter config --enable-linux-desktop
      - name: 📦 Install dependencies
        run: flutter pub get
      # One invocation per file. Passing the directory launches a fresh app per
      # file inside a single run, and on the Linux desktop device the second
      # launch never gets a debug connection ("The log reader stopped
      # unexpectedly, or never started"). Each suite passes on its own.
      #
      # The list is explicit rather than a glob over integration_test/e2e/,
      # because `service` and "runnable on a Linux CI runner" are different
      # axes. Every suite in that directory is tagged `service`; these four
      # are the ones this runner can actually execute. The remaining four are
      # excluded
      # for reasons no workflow change can fix:
      #
      #   c2pa_init                         — c2pa_flutter ships android/ and
      #                                       ios/ only, no desktop impl.
      #   video_creation_flow               — needs the invite service.
      #   deleted_video_visible_to_others   — needs the full stack.
      #   dm_optimistic_survives_watch_race — needs the full stack.
      #
      # local_stack cannot start on a GitHub runner at all:
      # divine-invite-darshan:e2e is a private GHCR package, compose resolves
      # every image before starting any, so zero containers come up. The two
      # suites below need none of it — they stand up their own in-process relay
      # (integration_test/helpers/fake_relay.dart).
      - name: 🚀 Run service integration tests
        run: |
          for suite in \
            integration_test/e2e/relay_list_admission_test.dart \
            integration_test/e2e/dm_inbox_relay_admission_test.dart \
            integration_test/e2e/reel_reply_retry_double_send_test.dart \
            integration_test/e2e/block_leaves_kind3_follow_test.dart; do
            echo "── $suite"
            xvfb-run -a flutter test "$suite" --tags service -d linux
          done
