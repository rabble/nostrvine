# ABOUTME: CI workflow for the followed_hashtags_repository package.
# ABOUTME: Runs tests, formatting, and analysis only when followed_hashtags_repository files change.

name: Followed Hashtags Repository CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/followed_hashtags_repository/**"
      - ".github/workflows/followed_hashtags_repository.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/followed_hashtags_repository/**"
      - ".github/workflows/followed_hashtags_repository.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: "mobile/packages/followed_hashtags_repository"
