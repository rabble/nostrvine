name: Mergeability Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  mergeability:
    name: mergeability
    uses: divinevideo/.github/.github/workflows/mergeability_check.yml@a3f061a18b9d699333952b4d258ba1299dfeb9f4
    with:
      base-ref: ${{ github.event.pull_request.base.ref }}
      base-repository: ${{ github.repository }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      workflow-repository-ref: a3f061a18b9d699333952b4d258ba1299dfeb9f4
